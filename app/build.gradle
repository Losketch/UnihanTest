plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 36
    namespace 'top.rainysummer.unihantest'

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "top.rainysummer.unicodetest"
        minSdkVersion 23
        targetSdkVersion 33
        versionCode 1710
        versionName "17.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "IS_DEBUG", "false"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

task buildRustLibs {
    def rustDir = file('src/main/rust')
    def targets = [
        'arm64-v8a': 'aarch64-linux-android',
        'armeabi-v7a': 'armv7-linux-androideabi',
        'x86_64': 'x86_64-linux-android',
        'x86': 'i686-linux-android'
    ]
    def jniLibsDir = file('src/main/jniLibs')
    
    targets.each { abi, target ->
        dependsOn "buildRustFor_${target}"
    }
}

def rustDir = file('src/main/rust')
def targets = [
    'arm64-v8a': 'aarch64-linux-android',
    'armeabi-v7a': 'armv7-linux-androideabi',
    'x86_64': 'x86_64-linux-android',
    'x86': 'i686-linux-android'
]
def jniLibsDir = file('src/main/jniLibs')

targets.each { abi, target ->
    task "buildRustFor_${target}"(type: Exec) {
        def sourceLib = file("${rustDir}/target/${target}/release/libfont_detector.so")
        def destLib = file("${jniLibsDir}/${abi}/libfont_detector.so")
        def rustSrc = fileTree(rustDir) {
            include 'src/**/*.rs'
            include 'Cargo.toml'
        }
        
        workingDir rustDir
        commandLine 'cargo', 'ndk', '-t', target, 'build', '--release', '--lib'
        
        inputs.files rustSrc
        outputs.file sourceLib
        
        doLast {
            def destDir = file("${jniLibsDir}/${abi}")
            destDir.mkdirs()
            copy {
                from sourceLib
                into destDir
            }
        }
    }
}

preBuild.dependsOn ':downloadUnicodeData', 'buildRustLibs'
