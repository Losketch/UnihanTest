[package]
name = "font-detector"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[lib]
name = "font_detector"
crate-type = ["cdylib", "staticlib"]

[dependencies]
ttf-parser = "0.25.1"
quick-xml = "0.39.0"
jni = "0.21"
log = "0.4"
android_logger = "0.13"
once_cell = "1.19"

[profile.release]
lto = true
debug = false
opt-level = "z"
codegen-units = 1
panic = "abort"
strip = true
