// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'de.undercouch:gradle-download-task:5.6.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    subprojects {
        afterEvaluate { project ->
            if (project.hasProperty('android')) {
                project.android {
                    if (namespace == null) {
                        namespace project.group
                    }
                }
            }
        }
    }
}


def unicodeVersion = "17.0.0" //latest
def unicodeDraftBaseUrl = "https://unicode.org/Public/draft/ucd"
def unicodeBaseUrl = "https://unicode.org/Public/${unicodeVersion}/ucd"
def unicodeFiles = [
    "Blocks.txt",
    "UnicodeData.txt",
    "Scripts.txt",
    "ScriptExtensions.txt"
]

// ./gradlew downloadUnicodeData -Poverwrite
tasks.register("downloadUnicodeData") {
    description = "Download Unicode data files for Java layer processing"
    group       = "unicode"

    doLast {
        def destDir = file("$projectDir/app/src/main/assets")
        destDir.mkdirs()

        unicodeFiles.each { fileName ->
            def destFile = new File(destDir, fileName)
            
            if (destFile.exists() && !project.hasProperty('overwrite')) {
                println "File ${fileName} already exists, skipping download"
                return
            }

            def downloaded = false
            
            try {
                println "Trying to download ${fileName} from draft URL..."
                def draftUrl = "${unicodeDraftBaseUrl}/${fileName}"
                ant.get(src: draftUrl, dest: destFile, verbose: true)
                println "Successfully downloaded ${fileName} from draft URL"
                downloaded = true
            } catch (Exception e) {
                println "Failed to download ${fileName} from draft URL: ${e.message}"
                destFile.delete()
            }

            if (!downloaded) {
                println "Falling back to ${unicodeVersion} version..."
                def versionUrl = "${unicodeBaseUrl}/${fileName}"
                ant.get(src: versionUrl, dest: destFile, verbose: true)
                println "Successfully downloaded ${fileName} from ${unicodeVersion} URL"
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
