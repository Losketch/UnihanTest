// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'de.undercouch:gradle-download-task:5.6.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    subprojects {
        afterEvaluate { project ->
            if (project.hasProperty('android')) {
                project.android {
                    if (namespace == null) {
                        namespace project.group
                    }
                }
            }
        }
    }
}


def unicodeVersion = "17.0.0"
def unicodeBaseUrl = "https://unicode.org/Public/${unicodeVersion}/ucd"
def unicodeFiles = [
    "Blocks.txt",
    "UnicodeData.txt",
    "Scripts.txt",
    "ScriptExtensions.txt"
]

tasks.register("downloadUnicodeData", de.undercouch.gradle.tasks.download.Download) {
    description = "Download Unicode data files for Java layer processing"
    group       = "unicode"

    src unicodeFiles.collect { "${unicodeBaseUrl}/${it}" }
    dest file("$projectDir/app/src/main/assets")
    overwrite false
    quiet false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
